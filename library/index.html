<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vox Mana - Library Route Alias</title>
<meta http-equiv="refresh" content="0; url=../apocrypha/">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../assets/img/vox-mana-header-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/fonts.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/topbar.css">
<link rel="stylesheet" href="../assets/css/atmosphere.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
body {
  margin: 0;
  color: var(--text);
  font-family: var(--font-text);
}

.library-alias {
  width: min(720px, calc(100% - 2rem));
  margin: 0 auto;
  padding: clamp(4rem, 10vw, 7rem) 0 var(--s-16);
}

.library-alias__panel {
  display: grid;
  gap: var(--s-4);
  padding: clamp(1.25rem, 4vw, 2rem);
}

.library-alias h1 {
  margin: 0;
  color: var(--gold-l);
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1.08;
  font-variation-settings: "opsz" 84, "wght" 580, "SOFT" 36;
}

.library-alias p {
  margin: 0;
  color: var(--text-dim);
}
</style>
<script>
window.location.replace(new URL("../apocrypha/", window.location.href).toString());
</script>
</head>
<body data-page="library" data-vm-current="apocrypha" data-bg="medium" data-bg-clean="true">

<div class="vm-bg" aria-hidden="true">
  <picture class="vm-bg__picture">
    <source type="image/webp" srcset="../assets/img/backgrounds/background-apocrypha-library-clean-01.webp 2560w" sizes="100vw">
    <img src="../assets/img/backgrounds/background-apocrypha-library-clean-01.webp" alt="" width="1672" height="941" decoding="async">
  </picture>
</div>

<main class="library-alias">
  <article class="vm-panel library-alias__panel">
    <p class="vm-card-kicker">Legacy Route</p>
    <h1>The library route now opens the Apocrypha.</h1>
    <p>This compatibility shell forwards the old <code>/library/</code> path into the canonical archive console at <code>/apocrypha/</code>.</p>
    <noscript>
      <p>JavaScript is off. Continue to <a href="../apocrypha/">/apocrypha/</a>.</p>
    </noscript>
  </article>
</main>

</body>
</html>
