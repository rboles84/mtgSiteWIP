<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
  <title id="title">Maze Scryfall flow</title>
  <desc id="desc">Maze search modes compile input into Scryfall queries, render diagnostics, and display cards.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fbfd0"/></marker><style>.bg{fill:#121315}.box{fill:#202225;stroke:#bfa46a;rx:7}.mode{fill:#172a2e;stroke:#62b7c4;rx:7}.text{fill:#f1ead7;font:13px Arial}.small{fill:#c9c0aa;font:12px Arial}.line{stroke:#8fbfd0;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="920" height="450"/>
  <rect class="box" x="40" y="185" width="135" height="54"/><text class="text" x="108" y="208" text-anchor="middle">Input</text><text class="small" x="108" y="225" text-anchor="middle">search field</text>
  <rect class="mode" x="240" y="60" width="160" height="54"/><text class="text" x="320" y="83" text-anchor="middle">Plain Reading</text><text class="small" x="320" y="100" text-anchor="middle">natural parser</text>
  <rect class="mode" x="240" y="185" width="160" height="54"/><text class="text" x="320" y="208" text-anchor="middle">Operator's Hand</text><text class="small" x="320" y="225" text-anchor="middle">raw syntax</text>
  <rect class="mode" x="240" y="310" width="160" height="54"/><text class="text" x="320" y="333" text-anchor="middle">Loom</text><text class="small" x="320" y="350" text-anchor="middle">visual builder</text>
  <rect class="box" x="480" y="125" width="160" height="54"/><text class="text" x="560" y="148" text-anchor="middle">Query inspector</text><text class="small" x="560" y="165" text-anchor="middle">diagnostics</text>
  <rect class="box" x="480" y="250" width="160" height="54"/><text class="text" x="560" y="273" text-anchor="middle">Scryfall search</text><text class="small" x="560" y="290" text-anchor="middle">search/exact/random</text>
  <rect class="box" x="720" y="185" width="145" height="54"/><text class="text" x="793" y="208" text-anchor="middle">Results grid</text><text class="small" x="793" y="225" text-anchor="middle">cards + modal</text>
  <rect class="box" x="720" y="310" width="145" height="54"/><text class="text" x="793" y="333" text-anchor="middle">No results</text><text class="small" x="793" y="350" text-anchor="middle">random fallback</text>
  <path class="line" d="M175 212 L240 87"/><path class="line" d="M175 212 L240 212"/><path class="line" d="M175 212 L240 337"/><path class="line" d="M400 87 L480 145"/><path class="line" d="M400 212 L480 150"/><path class="line" d="M400 337 L480 277"/><path class="line" d="M560 179 L560 250"/><path class="line" d="M640 277 L720 212"/><path class="line" d="M640 277 L720 337"/>
</svg>
