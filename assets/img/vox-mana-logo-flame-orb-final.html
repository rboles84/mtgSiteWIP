<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vox Mana — Flame Orb Logo Mark</title>
<style>
  html,body{min-height:100%}

  body.vm-logo-demo-page{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
    background:
      radial-gradient(circle at 50% 36%, rgba(20,92,88,.24), transparent 34%),
      radial-gradient(circle at 50% 68%, rgba(194,138,47,.12), transparent 32%),
      linear-gradient(180deg, #050606 0%, #010101 100%);
    color:rgba(237,226,194,.95);
    font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .vox-mana-logo,
  .vox-mana-logo *{
    box-sizing:border-box;
  }

  .vox-mana-logo{
    --vm-logo-gold-1:#f0d38a;
    --vm-logo-gold-2:#c28a2f;
    --vm-logo-text:rgba(237,226,194,.95);
    --vm-logo-panel-border:rgba(240,211,138,.12);
    --vm-logo-panel-border-2:rgba(240,211,138,.055);
    width:min(540px, 92vw);
    aspect-ratio:1/1;
    display:grid;
    place-items:center;
  }

  .vm-logo-stage{
    position:relative;
    display:grid;
    place-items:center;
    width:100%;
    border:1px solid var(--vm-logo-panel-border);
    border-radius:24px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.006)),
      radial-gradient(circle at 50% 42%, rgba(15,74,72,.18), transparent 48%);
    box-shadow:0 34px 90px rgba(0,0,0,.72), inset 0 0 0 1px rgba(255,255,255,.025);
    overflow:hidden;
  }

  .vm-logo-stage::before{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid var(--vm-logo-panel-border-2);
    border-radius:18px;
    pointer-events:none;
  }

  .vm-logo-svg{
    width:100%;
    height:auto;
    display:block;
    aspect-ratio:1/1;
  }

  /* Header-size helper. Add this class to the logo wrapper for nav/header placement. */
  .vox-mana-logo--header{
    width:clamp(84px, 10vw, 148px);
  }

  /* Plain mode removes the card/frame around the mark. */
  .vox-mana-logo--plain .vm-logo-stage{
    border:0;
    border-radius:0;
    background:transparent;
    box-shadow:none;
  }

  .vox-mana-logo--plain .vm-logo-stage::before{display:none}

  @media (prefers-reduced-motion: reduce){
    .vox-mana-logo animate,
    .vox-mana-logo animateTransform,
    .vox-mana-logo animateMotion{display:none}
  }
</style>
</head>
