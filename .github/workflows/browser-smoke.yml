name: Vox Mana Browser Smoke Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Manual Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run browser smoke
        run: npm run test:browser-smoke
